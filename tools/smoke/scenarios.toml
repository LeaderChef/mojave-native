# Authored scenario for the limited public source snapshot.
# The full upstream smoke runner is not included in this snapshot.

[[scenario]]
name = "documented-animation-groups"
source = "[documented] GECK AnimGroups; docs/spec-notes/animation-group-catalogue.md. Own fixture compiles and dispatches documented group names through ScriptRunner. Separate crate/Game tests verify numeric codes and queue flags. This scenario does not assert rendered animation or blending."
areas = ["scripts", "animation", "native-mac"]
paths = ["crates/fnv-script/data/encodings.json", "crates/fnv-script/tests/animation_groups.rs", "crates/fnv-game/tests/synthetic.rs", "tools/smoke/fixtures/animation-groups-home/"]
env = { NVFOREVER_HOME = "{repo}/tools/smoke/fixtures/animation-groups-home" }
args = ["--cell", "GSDocMitchellHouse", "--play", "--background-test", "--no-sound", "--no-voice", "--no-music", "--no-messages"]
run_seconds = 20
expect = [
  "script runner: ln_j6_animation_groups_probe.txt compiled",
  "script runner: ln_j6_animation_groups_probe.txt ran (new game)",
  "J6 animation groups: documented names compiled and dispatched",
]

[[scenario]]
name = "movement-alias-source"
source = "[documented] GECK Function Alias and MoveTo; docs/spec-notes/moveto-marker-alias.md. Own ScriptRunner source exercises the alias and checks the native actor-to-marker distance. Does not assert quest completion or visible gameplay."
areas = ["scripts", "native-mac"]
paths = ["schemas/script/functions.json", "crates/fnv-script/tests/movement_aliases.rs", "tools/smoke/fixtures/movement-alias-home/"]
env = { NVFOREVER_HOME = "{repo}/tools/smoke/fixtures/movement-alias-home" }
args = ["--cell", "GSDocMitchellHouse", "--play", "--background-test", "--no-sound", "--no-voice", "--no-music", "--no-messages"]
run_seconds = 20
expect = [
  "script runner: ln_j6_movement_alias_probe.txt compiled",
  "script runner: ln_j6_movement_alias_probe.txt ran (new game)",
  "J6 MoveToMarker: actor reached marker plus offset",
]

[[scenario]]
name = "creature-spread-optional-patch"
source = "[documented] JIP SetOptionalPatch; docs/spec-notes/creature-spread-optional-patch.md. Own startup script enables the native patch; a created creature fires harmless finite volleys before and after disable. Compare real projectile-consumer cones; no original game/mod script is copied."
areas = ["combat", "scripts", "native-mac"]
paths = ["crates/fnv-combat/src/spread.rs", "crates/fnv-game/src/nvse_gaps.rs", "crates/fnv-game/src/nvse_one111.rs", "engine/nvforever/src/npc_combat.rs", "engine/nvforever/src/use_weapon.rs", "tools/smoke/fixtures/creature-spread-home/"]
env = { NVFOREVER_HOME = "{repo}/tools/smoke/fixtures/creature-spread-home", NVF_PLAY_TEST_UNSEEN = "1", NVF_PLAY_TEST_GOD = "1", NVF_PLAY_TEST_SCRIPT_MENUS = "0.3", NVF_PLAY_TEST_SCRIPT = "2:call:VERGSCoyote1REF:Disable,2.1:call:VERGSCoyote2REF:Disable,2.2:call:VERGSCoyote3REF:Disable,2.3:call:VERGSCoyote4REF:Disable,2.4:call:VERGSCoyote5REF:Disable,2.5:call:VERGSCoyote6REF:Disable,3:call:0x00122CCA:PlaceAtMe:CrSentryBotMGHard:1,6:call:0xFF000000:UseWeapon:SentryBotMinigun2HR:0xFF000000:player:8:0:0:0:1,18:call:0xFF000000:UseWeapon:SentryBotMinigun2HR:0xFF000000:player:8:0:0:0:1", NVF_PLAY_TEST_CONSOLE = "16:SetOptionalPatch \"bCreatureSpreadFix\" 0;16.1:GetOptionalPatch \"bCreatureSpreadFix\";16.2:close" }
args = ["--cell", "Goodsprings", "--pos=-61000,4500,8500", "--play", "--background-test", "--hour", "12", "--no-sound", "--no-voice", "--no-music", "--no-messages"]
run_seconds = 32
expect = [
  "J6 creature spread: native patch enabled through source script",
  'console: SetOptionalPatch "bCreatureSpreadFix" 0 >> ran',
  { re = 'use weapon: .* 0xFF000000 has fired its 8 shots at the player', label = "finite creature volley finished" },
]

[[scenario]]
name = "native-clock-compat"
source = "[documented] JIP LN changelog 51.60; docs/spec-notes/native-clock-compat.md. The native clock is always correct, so GetOptionalPatch reports its invariant and an attempted disable warns instead of restoring the rounding bug. Companion runtime evidence checks actual clock/needs samples, not only these markers."
areas = ["scripts", "simulation", "native-mac"]
paths = ["crates/fnv-game/src/nvse_gaps.rs", "crates/fnv-game/tests/game_clock.rs", "tools/smoke/fixtures/native-clock-home/"]
env = { NVFOREVER_HOME = "{repo}/tools/smoke/fixtures/native-clock-home", NVF_PLAY_TEST_SCRIPT_MENUS = "0.3", NVF_PLAY_TEST_CONSOLE = "3:Set GameDaysPassed to 1000;3.1:Set GameHour to 12;3.2:Set TimeScale to 1;3.3:SetHardcore 1;3.4:player.SetAV Dehydration 10;3.5:close;5:PrintC \"J6 clock A days=%.8f hour=%.8f thirst=%.8f\" GameDaysPassed GameHour (player.GetAV Dehydration);5.1:close;12:PrintC \"J6 clock B days=%.8f hour=%.8f thirst=%.8f\" GameDaysPassed GameHour (player.GetAV Dehydration);12.1:SetOptionalPatch \"bGameDaysPassedFix\" 0;12.2:PrintC \"J6 clock invariant after disable=%.0f\" (GetOptionalPatch \"bGameDaysPassedFix\");12.3:close;21:PrintC \"J6 clock C days=%.8f hour=%.8f thirst=%.8f\" GameDaysPassed GameHour (player.GetAV Dehydration);21.1:close" }
args = ["--cell", "GSDocMitchellHouse", "--play", "--background-test", "--no-sound", "--no-voice", "--no-music", "--no-messages"]
run_seconds = 24
expect = [
  "J6 native clock: non-freezing native clock active",
  "J6 clock invariant after disable=1",
  "bGameDaysPassedFix is an always-on native clock invariant",
  "J6 clock A days=",
  "J6 clock B days=",
  "J6 clock C days=",
]
